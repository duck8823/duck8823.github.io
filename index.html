<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>duck8823 — Shunsuke Maeda / Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;600;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --serif: 'Noto Serif JP', 'Hiragino Mincho ProN', serif;
  --sans: 'Inter', 'Noto Sans JP', -apple-system, sans-serif;

  --bg:     oklch(0.965 0.008 85);
  --bg-2:   oklch(0.935 0.010 85);
  --bg-3:   oklch(0.90 0.012 85);
  --fg:     oklch(0.22 0.012 85);
  --fg-2:   oklch(0.40 0.010 85);
  --fg-3:   oklch(0.58 0.008 85);
  --rule:   oklch(0.85 0.010 85);
  --rule-2: oklch(0.78 0.012 85);
  --accent: oklch(0.58 0.16 145);
  --accent-soft: oklch(0.58 0.16 145 / 0.14);
  --warn:   oklch(0.68 0.17 55);
  --blue:   oklch(0.60 0.14 240);
}

html[data-theme="dark"] {
  --bg:     oklch(0.17 0.010 80);
  --bg-2:   oklch(0.21 0.012 80);
  --bg-3:   oklch(0.25 0.014 80);
  --fg:     oklch(0.94 0.008 85);
  --fg-2:   oklch(0.78 0.010 85);
  --fg-3:   oklch(0.58 0.010 85);
  --rule:   oklch(0.30 0.014 80);
  --rule-2: oklch(0.38 0.014 80);
  --accent: oklch(0.78 0.18 145);
  --accent-soft: oklch(0.78 0.18 145 / 0.16);
  --warn:   oklch(0.78 0.17 60);
  --blue:   oklch(0.70 0.14 240);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--mono);
  background: var(--bg);
  color: var(--fg-2);
  font-size: 14px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  transition: background-color .35s ease, color .35s ease;
  cursor: none;
}
@media (max-width: 720px) { body { cursor: auto; } }

::selection { background: var(--accent); color: var(--bg); }

a { color: inherit; text-decoration: none; }

/* ═══ Noise / grid backdrop ═══ */
.backdrop {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    linear-gradient(var(--rule) 1px, transparent 1px),
    linear-gradient(90deg, var(--rule) 1px, transparent 1px);
  background-size: 64px 64px;
  opacity: .28;
  mask-image: radial-gradient(ellipse at center, #000 0%, transparent 75%);
}
.backdrop::after {
  content: "";
  position: absolute; inset: 0;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='0.55'/></svg>");
  opacity: .05;
  mix-blend-mode: multiply;
}
html[data-theme="dark"] .backdrop::after { mix-blend-mode: screen; opacity: .04; }

/* ═══ Custom cursor ═══ */
.cursor-dot, .cursor-ring {
  position: fixed; top: 0; left: 0;
  pointer-events: none; z-index: 9999;
  transform: translate3d(-50%, -50%, 0);
  will-change: transform;
}
.cursor-dot {
  width: 6px; height: 6px;
  background: var(--accent);
  border-radius: 50%;
  transition: width .2s, height .2s, background .2s;
}
.cursor-ring {
  width: 28px; height: 28px;
  border: 1px solid var(--fg-2);
  border-radius: 50%;
  transition: width .25s ease, height .25s ease, border-color .25s;
  opacity: .65;
}
body.hovering .cursor-dot { width: 0; height: 0; }
body.hovering .cursor-ring { width: 44px; height: 44px; border-color: var(--accent); opacity: 1; }

/* ═══ Top chrome bar ═══ */
.chrome {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  font-family: var(--mono);
  font-size: 11px;
  background: color-mix(in oklch, var(--bg) 85%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--rule);
}
.chrome-inner {
  max-width: 1280px; margin: 0 auto;
  padding: 8px 24px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 16px;
}
.chrome-left { display: flex; gap: 16px; align-items: center; color: var(--fg-3); }
.chrome-dots { display: flex; gap: 6px; }
.chrome-dots span {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--rule-2);
}
.chrome-dots span:nth-child(1) { background: oklch(0.70 0.17 30); }
.chrome-dots span:nth-child(2) { background: oklch(0.82 0.14 85); }
.chrome-dots span:nth-child(3) { background: oklch(0.72 0.15 145); }
.chrome-path {
  font-weight: 500; color: var(--fg-2);
  letter-spacing: .02em;
}
.chrome-path .tilde { color: var(--accent); }
.chrome-center {
  font-weight: 500; color: var(--fg);
  letter-spacing: .04em;
  text-align: center;
}
.chrome-right {
  display: flex; gap: 10px; align-items: center; justify-content: flex-end;
  color: var(--fg-3);
}
.chrome-time {
  font-variant-numeric: tabular-nums;
  min-width: 130px; text-align: right;
}
.chrome-btn {
  border: 1px solid var(--rule-2);
  padding: 3px 10px;
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 11px;
  background: transparent;
  color: var(--fg-2);
  cursor: pointer;
  transition: all .2s;
}
.chrome-btn:hover { border-color: var(--accent); color: var(--accent); }
.chrome-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }

/* ═══ Layout ═══ */
.wrap {
  max-width: 1180px;
  margin: 0 auto;
  padding: 0 40px;
  position: relative;
  z-index: 1;
}
@media (max-width: 720px) {
  .wrap { padding: 0 20px; }
  .chrome-inner { grid-template-columns: auto 1fr auto; padding: 8px 14px; }
  .chrome-center { display: none; }
  .chrome-time { display: none; }
  .chrome-path { font-size: 10px; }
}

/* ═══ Section shared ═══ */
.section {
  padding: 96px 0;
  position: relative;
  border-top: 1px dashed var(--rule);
}
.section:first-of-type { border-top: none; }

.section-head {
  display: grid;
  grid-template-columns: 200px 1fr;
  gap: 40px;
  margin-bottom: 48px;
  align-items: baseline;
}
.section-kicker {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--fg-3);
  letter-spacing: .1em;
  text-transform: uppercase;
}
.section-kicker::before { content: "§ "; color: var(--accent); }
.section-title {
  font-family: var(--serif);
  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 600;
  color: var(--fg);
  line-height: 1;
  letter-spacing: -0.02em;
}
.section-title .en {
  display: block;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 500;
  color: var(--fg-3);
  letter-spacing: .12em;
  text-transform: uppercase;
  margin-bottom: 10px;
}

@media (max-width: 720px) {
  .section { padding: 64px 0; }
  .section-head { grid-template-columns: 1fr; gap: 12px; margin-bottom: 32px; }
}

/* ═══ Scroll reveal ═══ */
.reveal {
  opacity: 0;
  transform: translateY(20px);
  transition: opacity .7s ease, transform .7s cubic-bezier(.2,.7,.2,1);
}
.reveal.in { opacity: 1; transform: none; }

/* ═══ Tweaks panel ═══ */
.tweaks-panel {
  position: fixed;
  bottom: 24px; right: 24px;
  z-index: 100;
  background: var(--bg-2);
  border: 1px solid var(--rule-2);
  border-radius: 8px;
  font-family: var(--mono);
  font-size: 11px;
  min-width: 220px;
  box-shadow: 0 8px 32px rgba(0,0,0,.08);
  overflow: hidden;
  display: none;
}
.tweaks-panel.open { display: block; }
.tweaks-hdr {
  padding: 8px 12px;
  border-bottom: 1px solid var(--rule);
  color: var(--fg-3);
  display: flex; justify-content: space-between;
  background: var(--bg-3);
}
.tweaks-row {
  padding: 10px 12px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--rule);
  gap: 10px;
}
.tweaks-row:last-child { border-bottom: none; }
.tweaks-row label { color: var(--fg-2); }
.tweaks-seg {
  display: inline-flex;
  border: 1px solid var(--rule-2);
  border-radius: 4px;
  overflow: hidden;
}
.tweaks-seg button {
  padding: 3px 10px;
  font-family: var(--mono);
  font-size: 11px;
  background: transparent;
  color: var(--fg-2);
  border: none;
  cursor: pointer;
  transition: all .15s;
}
.tweaks-seg button.active {
  background: var(--accent);
  color: var(--bg);
}
</style>

<style id="hero-style">
/* ═══ Hero ═══ */
.hero {
  min-height: 100vh;
  padding: 120px 0 60px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  position: relative;
}

.hero-terminal {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--fg-3);
  margin-bottom: 40px;
  line-height: 1.9;
  min-height: 160px;
}
.hero-terminal .line { display: block; white-space: pre-wrap; }
.hero-terminal .prompt { color: var(--accent); }
.hero-terminal .ok { color: var(--accent); }
.hero-terminal .warn { color: var(--warn); }
.hero-terminal .dim { color: var(--fg-3); }
.hero-terminal .cmd { color: var(--fg); font-weight: 500; }
.hero-terminal .cursor-blink {
  display: inline-block;
  width: 8px;
  height: 13px;
  background: var(--accent);
  vertical-align: -2px;
  margin-left: 2px;
  animation: blink 1.05s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

.hero-name-block {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 48px;
  align-items: end;
}
.hero-name {
  font-family: var(--serif);
  font-weight: 900;
  font-size: clamp(3.5rem, 10vw, 8.5rem);
  line-height: 0.88;
  letter-spacing: -0.035em;
  color: var(--fg);
}
.hero-name .jp {
  display: block;
  font-size: 0.32em;
  font-weight: 600;
  color: var(--fg-2);
  letter-spacing: .02em;
  margin-top: 18px;
  line-height: 1.2;
}
.hero-name .duck {
  font-family: var(--mono);
  font-size: 0.16em;
  font-weight: 500;
  color: var(--accent);
  letter-spacing: 0;
  display: block;
  margin-top: 18px;
}

.hero-pets {
  display: flex;
  flex-direction: column;
  gap: 14px;
  align-items: flex-start;
  min-width: 180px;
}
.hero-pet-frame {
  position: relative;
  width: 180px; height: 180px;
  border: 1px solid var(--rule-2);
  padding: 8px;
  background: var(--bg-2);
}
.hero-pet-frame img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  filter: saturate(1.05);
}
.hero-pet-frame::before {
  content: attr(data-name);
  position: absolute;
  top: -10px; left: 8px;
  background: var(--bg);
  padding: 0 8px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--fg-3);
}
.hero-pet-frame::after {
  content: attr(data-meta);
  position: absolute;
  bottom: -10px; right: 8px;
  background: var(--bg);
  padding: 0 8px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--accent);
}
.hero-pet-row {
  display: flex; gap: 10px;
}
.hero-pet-row .hero-pet-frame { width: 110px; height: 110px; }

.hero-intro {
  margin-top: 64px;
  display: grid;
  grid-template-columns: 200px 1fr 280px;
  gap: 48px;
  align-items: start;
  padding-top: 32px;
  border-top: 1px solid var(--rule);
}
.hero-intro-label {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--fg-3);
  letter-spacing: .1em;
  text-transform: uppercase;
}
.hero-intro-body {
  font-family: var(--serif);
  font-size: 17px;
  line-height: 1.8;
  color: var(--fg);
  font-weight: 400;
}
.hero-intro-body em {
  color: var(--accent);
  font-style: normal;
  font-weight: 600;
}
.hero-intro-meta {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--fg-3);
  line-height: 2;
}
.hero-intro-meta div { display: flex; gap: 10px; }
.hero-intro-meta .k { min-width: 80px; color: var(--fg-3); }
.hero-intro-meta .v { color: var(--fg-2); }
.hero-intro-meta .v .hl { color: var(--accent); }

.hero-socials {
  margin-top: 40px;
  display: flex; gap: 6px; flex-wrap: wrap;
}
.hero-socials a {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 12px;
  border: 1px solid var(--rule-2);
  font-family: var(--mono);
  font-size: 11px;
  color: var(--fg-2);
  transition: all .2s;
}
.hero-socials a:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.hero-socials a svg { width: 13px; height: 13px; fill: currentColor; }

@media (max-width: 900px) {
  .hero-name-block { grid-template-columns: 1fr; gap: 32px; }
  .hero-pets { flex-direction: row; flex-wrap: wrap; }
  .hero-intro { grid-template-columns: 1fr; gap: 16px; }
}
</style>

<style id="blocks-style">
/* ═══ Skills grid (stacked chips) ═══ */
.skills-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
  font-family: var(--mono);
  font-size: 12px;
}
.skill-cell {
  padding: 14px 16px;
  background: var(--bg);
  color: var(--fg);
  display: flex;
  flex-direction: column;
  gap: 4px;
  transition: background .2s;
}
.skill-cell:hover { background: var(--accent-soft); }
.skill-cell .k { color: var(--fg-3); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
.skill-cell .v { color: var(--fg); font-weight: 500; }

/* ═══ Experience ═══ */
.xp-list {}
.xp {
  display: grid;
  grid-template-columns: 200px 1fr auto;
  gap: 40px;
  padding: 28px 0;
  border-top: 1px solid var(--rule);
  align-items: start;
}
.xp:last-child { border-bottom: 1px solid var(--rule); }
.xp-when {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--fg-3);
  letter-spacing: .08em;
}
.xp-when .bullet { color: var(--accent); }
.xp-body h3 {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 600;
  color: var(--fg);
  margin-bottom: 6px;
  letter-spacing: -.01em;
}
.xp-body p {
  font-family: var(--sans);
  font-size: 14px;
  color: var(--fg-2);
  margin-bottom: 10px;
  line-height: 1.7;
  max-width: 620px;
}
.xp-tags { display: flex; gap: 4px; flex-wrap: wrap; }
.tag-xs {
  font-family: var(--mono);
  font-size: 10px;
  padding: 2px 7px;
  border: 1px solid var(--rule-2);
  color: var(--fg-3);
  letter-spacing: .03em;
}
.xp-dur {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--fg-3);
  text-align: right;
  white-space: nowrap;
}
@media (max-width: 720px) {
  .xp { grid-template-columns: 1fr; gap: 10px; }
  .xp-dur { text-align: left; }
}

/* ═══ Projects ═══ */

  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
}
.proj {
  background: var(--bg);
  padding: 24px;
  display: flex; flex-direction: column; gap: 12px;
  transition: background .2s;
  min-height: 200px;
}
.proj:hover { background: var(--bg-2); }
.proj-featured {

}
.proj-badge {

  font-size: 10px;
  padding: 3px 8px;
  background: var(--accent);
  color: var(--bg);
  letter-spacing: .08em;
  text-transform: uppercase;
  vertical-align: 4px;
  font-weight: 500;
}
.proj-hdr {
  display: flex; justify-content: space-between; align-items: baseline;
}
.proj-name {
  font-family: var(--mono);
  font-size: 18px;
  font-weight: 600;
  color: var(--fg);
}
.proj-name .slash { color: var(--accent); }
.proj-stars {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--warn);
}
.proj-desc {
  font-family: var(--sans);

.proj-foot {

.proj-link {

.proj:hover .proj-link { color: var(--accent); }

@media (max-width: 720px) {

}

/* ═══ Apps ═══ */
.apps-grid {

}
.app-card {

.app-card p {

/* ═══ Talks / Writing ═══ */
.talks {}
.talk {
  display: grid;
  grid-template-columns: 100px 1fr auto;
  gap: 32px;
  padding: 20px 0;
  border-top: 1px solid var(--rule);

}
.talk:last-child { border-bottom: 1px solid var(--rule); }
.talk:hover { padding-left: 14px; background: linear-gradient(90deg, var(--accent-soft), transparent 80%); }
.talk-year {

  color: var(--fg-3);

}

  font-size: 18px;

  .talk-arrow { display: none; }
}

/* ═══ Contribution graph ═══ */
.contrib-wrap {
  background: var(--bg-2);
  border: 1px solid var(--rule);
  padding: 24px;
  font-family: var(--mono);
  font-size: 11px;
}
.contrib-hdr {
  display: flex; justify-content: space-between; margin-bottom: 14px;
  color: var(--fg-3);
}
.contrib-hdr .total { color: var(--fg); font-weight: 500; }
.contrib-hdr .total .n { color: var(--accent); font-weight: 700; }
.contrib-grid {
  display: grid;
  grid-template-columns: repeat(53, minmax(0,1fr));
  grid-auto-rows: 1fr;
  gap: 3px;
  aspect-ratio: 53/7;
  max-width: 100%;
}
.contrib-cell {
  aspect-ratio: 1;
  background: var(--bg-3);
  border-radius: 2px;
  transition: transform .15s;
}
.contrib-cell:hover { transform: scale(1.8); }
.contrib-cell.l1 { background: color-mix(in oklch, var(--accent) 25%, var(--bg-3)); }
.contrib-cell.l2 { background: color-mix(in oklch, var(--accent) 50%, var(--bg-3)); }
.contrib-cell.l3 { background: color-mix(in oklch, var(--accent) 75%, var(--bg-3)); }
.contrib-cell.l4 { background: var(--accent); }
.contrib-foot {
  display: flex; justify-content: space-between; margin-top: 14px;
  color: var(--fg-3);
  font-size: 10px;
}
.contrib-legend { display: flex; align-items: center; gap: 6px; }
.contrib-legend .box { width: 10px; height: 10px; border-radius: 2px; }

/* ═══ Pet gallery ═══ */
.pet-gallery {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  grid-auto-rows: 90px;
  grid-auto-flow: dense;
  gap: 6px;
}
.pet-tile {
  position: relative;
  background: var(--bg-3);
  overflow: hidden;
  border: 1px solid var(--rule);
}
.pet-tile img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s; display: block; }
.pet-tile:hover img { transform: scale(1.06); }
.pet-tile::after {
  content: attr(data-tag);
  position: absolute;
  left: 6px; bottom: 6px;
  font-family: var(--mono);
  font-size: 9px;
  padding: 2px 6px;
  background: var(--bg);
  color: var(--fg-2);
  letter-spacing: .05em;
  opacity: 0;
  transition: opacity .2s;
}
.pet-tile:hover::after { opacity: 1; }

/* Placeholder tile rendered as CSS (no real pet photos available) */
.pet-placeholder {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--fg-3);
  background-image:
    repeating-linear-gradient(45deg, transparent 0 10px, var(--rule) 10px 11px);
}

/* ═══ Now section ═══ */
.now {
  background: var(--bg-2);
  border: 1px solid var(--rule);
  padding: 28px 32px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 32px;
  font-family: var(--mono);
  font-size: 12px;
}
.now-item .k {
  color: var(--fg-3);
  font-size: 10px;
  letter-spacing: .1em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.now-item .v {
  color: var(--fg);
  font-size: 14px;
  line-height: 1.6;
}
.now-item .v .hl { color: var(--accent); }

@media (max-width: 720px) {
  .now { grid-template-columns: 1fr; gap: 20px; padding: 20px; }
}

/* ═══ Footer ═══ */
.footer {
  padding: 64px 0 100px;
  border-top: 1px dashed var(--rule);
  font-family: var(--mono);
  font-size: 11px;
  color: var(--fg-3);
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 20px;
  align-items: baseline;
}
.footer .ascii {
  font-size: 9px;
  line-height: 1.1;
  white-space: pre;
  color: var(--accent);
  opacity: .5;
  overflow: hidden;
}
</style>
